<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha de Canjes</title>
<style>
:root{
  --ink:#141210;
  --panel:#1d1a16;
  --panel-2:#242019;
  --line: #3a332a;
  --gold:#c19a49;
  --gold-bright:#e0b968;
  --gold-dim:#8a713a;
  --arcane:#7d6bab;
  --arcane-bright:#9a86c4;
  --parchment:#ece4d1;
  --parchment-dim:#a89a82;
  --good:#89a37c;
  --bad:#c1604a;
  --serif: "Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans: -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --radius: 8px;
  --radius-sm: 5px;
  --shadow-1: 0 2px 10px rgba(0,0,0,0.28);
  --shadow-2: 0 8px 28px rgba(0,0,0,0.38);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(125,107,171,0.10), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, rgba(193,154,73,0.08), transparent 55%),
    var(--ink);
  color:var(--parchment);
  font-family:var(--sans);
  line-height:1.45;
  min-height:100vh;
}
a{color:inherit;}

.masthead{
  padding:44px 28px 26px;
  text-align:left;
  max-width:1180px;
  margin:0 auto;
  border-bottom:1px solid var(--line);
  position:relative;
}
.masthead .eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:0.72rem;text-transform:uppercase;letter-spacing:0.16em;
  color:var(--gold-dim);margin-bottom:10px;
}
.masthead .eyebrow::before{content:"✦";color:var(--gold);}
.masthead h1{
  font-family:var(--serif);
  font-weight:400;
  font-size:2.6rem;
  margin:0 0 10px;
  letter-spacing:0.3px;
  background:linear-gradient(100deg, var(--gold-bright), var(--parchment) 55%, var(--arcane-bright));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}
.masthead p{
  margin:0;
  color:var(--parchment-dim);
  font-size:0.95rem;
  max-width:620px;
}

.ledger-wrap{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(20,18,16,0.94);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  box-shadow:var(--shadow-1);
}
.ledger{
  max-width:1180px;
  margin:0 auto;
  padding:16px 28px;
  display:flex;
  align-items:center;
  gap:26px;
  flex-wrap:wrap;
}
.ledger-item{
  display:flex;flex-direction:column;gap:2px;min-width:100px;
  padding-right:26px;border-right:1px solid var(--line);
}
.ledger-item:last-of-type{border-right:none;}
.ledger-item .lbl{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--parchment-dim);}
.ledger-item .val{font-family:var(--serif);font-size:1.55rem;color:var(--gold);transition:color .15s ease;}
.ledger-item.remain .val{color:var(--good);}
.ledger-item.remain.negative .val{color:var(--bad);}
.ledger-item.cart-quick{cursor:pointer;border-right:1px solid var(--line);}
.ledger-item.cart-quick .val{color:var(--arcane-bright);}
.ledger-item.cart-quick:hover .val{color:var(--arcane);}
.ledger-input{
  background:transparent;
  border:none;
  border-bottom:1px solid var(--gold-dim);
  color:var(--gold);
  font-family:var(--serif);
  font-size:1.55rem;
  width:110px;
  padding:0 2px 3px;
  transition:border-color .15s ease;
}
.ledger-input:focus{outline:none;border-bottom-color:var(--gold-bright);}
.ledger-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}

.tabs{
  max-width:1180px;
  margin:0 auto;
  padding:16px 28px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.tab-btn{
  background:transparent;
  border:1px solid transparent;
  color:var(--parchment-dim);
  font-family:var(--sans);
  font-size:0.84rem;
  padding:8px 15px;
  cursor:pointer;
  border-radius:999px;
  transition:color .15s ease, background .15s ease, border-color .15s ease, transform .1s ease;
}
.tab-btn:hover{color:var(--parchment);background:var(--panel-2);}
.tab-btn:active{transform:scale(0.97);}
.tab-btn.active{
  color:var(--ink);
  background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
  border-color:var(--gold-dim);
  font-weight:600;
}
.tab-btn.cart-tab{color:var(--arcane-bright);}
.tab-btn.cart-tab:hover{background:rgba(125,107,171,0.14);}
.tab-btn.cart-tab.active{
  background:linear-gradient(135deg, var(--arcane-bright), var(--arcane));
  border-color:var(--arcane);
  color:#fff;
}

.content{
  max-width:1180px;
  margin:0 auto;
  padding:30px 28px 90px;
}
.panel{display:none;}
.panel.active{display:block;opacity:1;animation:fadeIn .22s ease forwards;}
@keyframes fadeIn{ from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }

h2.section-title{
  font-family:var(--serif);
  font-weight:400;
  font-size:1.6rem;
  margin:0 0 6px;
  color:var(--parchment);
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.section-sub{
  color:var(--parchment-dim);
  font-size:0.86rem;
  margin:12px 0 22px;
}
.subtotal-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--panel-2);
  border:1px solid var(--gold-dim);
  border-radius:20px;
  padding:5px 13px;
  font-size:0.8rem;
  color:var(--parchment-dim);
  margin-left:10px;
  box-shadow:var(--shadow-1);
}
.subtotal-pill b{color:var(--gold-bright);font-weight:700;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px 17px;
  box-shadow:var(--shadow-1);
  transition:border-color .15s ease, transform .12s ease;
}
.card:hover{border-color:var(--gold-dim);}
.card-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.card-row + .card-row{margin-top:10px;}
.card-name{font-size:0.92rem;color:var(--parchment);font-weight:600;}
.card-cost{font-size:0.82rem;color:var(--gold-dim);min-width:64px;text-align:right;}

select, input[type="number"], input[type="text"]{
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--parchment);
  border-radius:var(--radius-sm);
  padding:6px 9px;
  font-size:0.85rem;
  font-family:var(--sans);
  transition:border-color .15s ease;
}
select:hover, input:hover{border-color:var(--gold-dim);}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(193,154,73,0.15);}

/* buy-row: nivel actual -> nivel nuevo -> preview -> agregar */
.buy-row{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px dashed var(--line);
}
.buy-row .field{display:flex;flex-direction:column;gap:3px;}
.buy-row .field label{font-size:0.64rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--parchment-dim);}
.buy-row select{min-width:64px;}
.buy-preview{
  font-size:0.85rem;color:var(--gold-bright);font-weight:700;min-width:70px;text-align:center;
}
.buy-preview.zero{color:var(--parchment-dim);font-weight:400;}
.arrow{color:var(--gold-dim);font-size:1rem;padding-top:16px;}

.btn{
  background:linear-gradient(135deg, var(--gold-bright), var(--gold-dim));
  color:#171410;
  border:none;
  border-radius:var(--radius-sm);
  padding:8px 16px;
  font-size:0.82rem;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(193,154,73,0.18);
  transition:filter .15s ease, opacity .15s ease, transform .1s ease;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.32;cursor:not-allowed;box-shadow:none;filter:none;}
.btn.ghost{
  background:none;border:1px solid var(--line);color:var(--parchment-dim);box-shadow:none;
}
.btn.ghost:hover{color:var(--parchment);border-color:var(--parchment-dim);filter:none;}
.btn.arcane{background:linear-gradient(135deg, var(--arcane-bright), var(--arcane));color:#fff;box-shadow:0 2px 10px rgba(125,107,171,0.28);}
.btn.arcane:hover{filter:brightness(1.1);}

/* skill category block */
.skill-cat{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:3px solid var(--gold-dim);
  border-radius:var(--radius);
  padding:14px 16px;
  margin-bottom:14px;
  box-shadow:var(--shadow-1);
}
.skill-cat > .cat-head{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;
}
.skill-cat > .cat-head h3{
  font-family:var(--serif);font-weight:400;font-size:1.1rem;margin:0;color:var(--gold-bright);
}
.skill-cat .cat-head .stat-cost{font-size:0.78rem;color:var(--gold-dim);}

/* add-row component */
.adder{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:16px;
  box-shadow:var(--shadow-1);
}
.adder select{flex:1;min-width:150px;}
.adder .field{display:flex;flex-direction:column;gap:3px;}
.adder .field label{font-size:0.64rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--parchment-dim);}

.chip-list{display:flex;flex-direction:column;gap:7px;}
.chip{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--gold-dim);
  border-radius:var(--radius-sm);
  padding:9px 12px;font-size:0.85rem;gap:10px;flex-wrap:wrap;
  transition:border-color .15s ease, transform .1s ease;
}
.chip:hover{border-color:var(--gold-dim);transform:translateX(2px);}
.chip .chip-info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.chip .chip-cost{color:var(--gold-bright);font-weight:700;font-size:0.82rem;}
.chip .cat-tag{
  font-size:0.64rem;text-transform:uppercase;letter-spacing:0.05em;
  color:#fff;background:var(--arcane);border-radius:10px;
  padding:2px 8px;font-weight:600;
}
.chip .chip-remove{
  background:none;border:none;color:var(--parchment-dim);cursor:pointer;
  font-size:1rem;line-height:1;padding:2px 6px;border-radius:4px;
  transition:color .15s ease, background .15s ease;
}
.chip .chip-remove:hover{color:var(--bad);background:rgba(193,96,74,0.12);}
.empty-note{color:var(--parchment-dim);font-size:0.85rem;font-style:italic;padding:14px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);}

/* checklist (talentos) */
.check-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:2px 18px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:6px 14px;box-shadow:var(--shadow-1);
}
@media(max-width:700px){.check-grid{grid-template-columns:1fr;}}
.check-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 4px;border-bottom:1px dashed var(--line);
  font-size:0.85rem;transition:background .12s ease;
}
.check-row:hover{background:var(--panel-2);}
.check-row label{flex:1;cursor:pointer;}
.check-row .price{color:var(--gold-dim);font-size:0.78rem;min-width:44px;text-align:right;}
.check-row input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px;}

/* arcanos */
.arc-group{
  background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--arcane);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow-1);
}
.arc-group h3{font-family:var(--serif);font-weight:400;font-size:1.1rem;margin:0 0 10px;color:var(--parchment);}
.arc-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);}
.arc-row:last-of-type{border-bottom:none;}
.arc-row label{font-size:0.85rem;color:var(--parchment);}
.arc-row label small{display:block;color:var(--parchment-dim);font-size:0.72rem;}
.arc-row input[type=number]{width:64px;text-align:center;}
.warn-text{color:var(--bad);font-size:0.75rem;margin-top:8px;padding:6px 8px;background:rgba(193,96,74,0.1);border-radius:var(--radius-sm);}

/* armas */
.weapon-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-2);
}
.weapon-card h3{font-family:var(--serif);font-weight:400;font-size:1.2rem;margin:0 0 14px;color:var(--gold-bright);}
.weapon-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media(max-width:820px){.weapon-cols{grid-template-columns:1fr;}}
.weapon-col h4{font-size:0.85rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--parchment-dim);margin:0 0 8px;}
.weapon-summary{
  display:flex;gap:18px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  flex-wrap:wrap;font-size:0.82rem;color:var(--parchment-dim);
}
.weapon-summary b{color:var(--gold);}
.slots-bad{color:var(--bad);}
.slots-ok{color:var(--good);}

/* carrito */
.cart-hero{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  background:linear-gradient(135deg, rgba(125,107,171,0.16), var(--panel) 60%);
  border:1px solid var(--arcane);border-radius:var(--radius);
  padding:22px 26px;margin-bottom:22px;box-shadow:var(--shadow-2);
}
.cart-hero .cart-total-num{font-family:var(--serif);font-size:2.3rem;color:var(--arcane-bright);}
.cart-hero .cart-total-lbl{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--parchment-dim);}
.cart-section-title{
  font-family:var(--serif);font-weight:400;color:var(--gold-bright);margin:24px 0 12px;font-size:1.1rem;
  padding-bottom:6px;border-bottom:1px solid var(--line);
}

footer.note{
  max-width:1180px;margin:0 auto;padding:0 28px 60px;color:var(--parchment-dim);font-size:0.78rem;
}

.summary-toolbar{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;
}
.copy-status{font-size:0.8rem;color:var(--good);opacity:0;transition:opacity .2s ease;}
.copy-status.show{opacity:1;}
.summary-box{
  background:var(--panel);
  border:1px solid var(--line);
  border-top:3px solid var(--gold-dim);
  border-radius:var(--radius);
  padding:24px 28px;
  font-family:"Courier New",Consolas,monospace;
  font-size:0.88rem;
  line-height:1.8;
  white-space:pre-wrap;
  color:var(--parchment);
  max-height:70vh;
  overflow-y:auto;
  box-shadow:var(--shadow-2);
}
.summary-box::-webkit-scrollbar{width:8px;}
.summary-box::-webkit-scrollbar-track{background:var(--panel-2);}
.summary-box::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:4px;}
.summary-box .sec-heading{
  color:var(--gold-bright);
  font-weight:700;
  letter-spacing:0.03em;
}
.summary-box .sec-total{
  color:var(--arcane-bright);
  font-weight:700;
}
</style>
</head>
<body>

<div class="masthead">
  <span class="eyebrow">Canjes de personaje</span>
  <h1>Ficha de Canjes</h1>
  <p>Calculadora de canje de grageas para personajes. Elegí el nivel actual y el nivel al que querés subir: el sistema calcula el costo acumulativo real de la mejora y lo suma al carrito.</p>
</div>

<div class="ledger-wrap">
  <div class="ledger">
    <div class="ledger-item">
      <span class="lbl">Grageas disponibles</span>
      <input id="inpDisponibles" class="ledger-input" type="number" value="0" placeholder="0">
    </div>
    <div class="ledger-item">
      <span class="lbl">Gastadas</span>
      <span class="val" id="valGastadas">0</span>
    </div>
    <div class="ledger-item remain">
      <span class="lbl">Restantes</span>
      <span class="val" id="valRestantes">0</span>
    </div>
    <div class="ledger-item cart-quick" id="cartQuickNav">
      <span class="lbl">Carrito</span>
      <span class="val" id="valCartQuick">0 gr</span>
    </div>
    <div class="ledger-actions">
      <button class="btn ghost" id="resetAllBtn">Reiniciar todo</button>
    </div>
  </div>
</div>

<div class="tabs" id="tabBar"></div>

<div class="content" id="tabContent"></div>

<script>
/* =========================================================
   DATA TABLES  (extraídas de la hoja "Referencias")
   ========================================================= */
const STAT_TABLE = {
  individual:[0,250,300,400,550,750,1000,1300,1750],
  acumulado:[0,250,550,950,1500,2250,3250,4550,6300]
};
const SKILL_TABLE = {
  individual:[0,75,150,250,400,750],
  acumulado:[0,75,225,475,875,1625]
};
const ESPEC_TABLE = {
  individual:[0,150,300,450,600,750],
  acumulado:[0,150,450,900,1500,2250]
};
const TRASF_GEN_TABLE = {
  individual:[0,100,200,300,400,500],
  acumulado:[0,100,300,600,1000,1500]
};
const TRASF_ESP_TABLE = {
  individual:[0,50,100,150,200,350],
  acumulado:[0,50,150,300,500,850]
};

const STATS = ["Vigor","Destreza","Carisma","Voluntad","Percepción","Inteligencia","Poder"];

const SKILL_GROUPS = {
  "Vigor": ["Atletismo","Pelea"],
  "Destreza": ["Esquivar","Latrocinio","Sigilo","Volar"],
  "Carisma": ["Coordinación","Intimidación","Oratoria","Seducir","Subterfugio"],
  "Voluntad": ["Arte (X)","Estilo","Frialdad"],
  "Percepción": ["Alerta","Consciencia","Empatía","Iniciativa","Investigación"],
  "Inteligencia": ["Adivinación","Arcanismo","Callejeo","Cultura Mágica","Cultura Muggle","Herbología","Magizoología","Medicina","Política","Supervivencia"],
  "Poder": ["Duelo","Pociones","Rituales"]
};

const TRASF_GENERALES = ["Biblioteca","Informantes","Seguidores","Influencia","Fama","Orden de Merlín","Patrón","Recursos"];

const CONOCIMIENTO_CATEGORIAS = {
  "Adivinación": ["Métodos adivinatorios","Profecías"],
  "Arcanismo": ["Arcanos","Artes oscuras","No-Seres","Objetos mágicos","Otros planos"],
  "Callejeo": ["Contrabando","Criminales","Localizaciones"],
  "Cultura Mágica": ["Deportes mágicos","Historia de la magia","Hogwarts (secretos)","Mundo del corazón"],
  "Cultura Muggle": ["Arte muggle","Deportes muggles","Tecnología"],
  "Herbología": ["Pociones","Plantas naturales"],
  "Magizoología": ["Animales muggles","Bestias mágicas","Espíritus","Seres racionales"],
  "Medicina": ["Enfermedades mágicas","Experimental","Heridas mágicas","Medicina muggle"],
  "Política": ["Ley mágica","Ministerio de Magia"],
  "Supervivencia": ["Caza","Entornos hostiles","Orientarse"]
};
const SOCIAL_CATEGORIAS = {
  "Académicos": ["Adivinadores y oráculos","Arcanistas","Arqueólogos e historiadores","Biólogos e investigadores médicos","Herbólogos y pocionistas","Magizoólogos","Muggleólogos"],
  "Bajos fondos": ["Contrabandistas","Estafadores","Evanescedores","Falsificadores","Ladrones","Sanadores ilegales","Soplones"],
  "Hogwarts": ["Gryffindor","Hufflepuff","Ravenclaw","Slytherin","Fauna de Hogwarts","Personal no docente","Profesorado"],
  "Política": ["Azkaban","Bastión Woodcroft","Confederación Internacional de Magos","Gringotts","Hogsmeade","Ministerio de Magia","San Mungo","Gobierno mágico de (X país)"],
  "Seres mágicos": ["Arpías","Centauros","Duendes","Gente del Agua","Gigantes","Hombres Lobo","Vampiros"],
  "Sociedad": ["Alta sociedad","Deportes","Fantasmas","La Reserva","Muggles","Negocios","Prensa"]
};
const TIPOS_ESPECIFICO = ["Biblioteca","Influencia","Informantes","Seguidores"];
function categoriasParaTipo(tipo){
  return tipo === "Biblioteca" ? CONOCIMIENTO_CATEGORIAS : SOCIAL_CATEGORIAS;
}

const TALENTOS = [
  ["Acción coordinada",100],["Aliado Común",300],["Aliado Dotado",600],["Aliado Torpe",100],

function makeInitialState(){
  return {
    disponibles: 0,
    cart: [], // {id, category, line, cost}
    statsBase: Object.fromEntries(STATS.map(s=>[s,0])),
    statsTarget: Object.fromEntries(STATS.map(s=>[s,1])),
    skillsBase: Object.fromEntries(Object.values(SKILL_GROUPS).flat().map(s=>[s,0])),
    skillsTarget: Object.fromEntries(Object.values(SKILL_GROUPS).flat().map(s=>[s,1])),
    trasfGenBase: Object.fromEntries(TRASF_GENERALES.map(t=>[t,0])),
    trasfGenTarget: Object.fromEntries(TRASF_GENERALES.map(t=>[t,1])),
    titulos: [],
    idiomas: [],
    talentos: new Set(),
    raza: "Humano",
    arcanos: Object.fromEntries(
      [...ARCANO_TIERS,...POCION_TIERS,...RITUAL_TIERS,...OBJETO_TIERS].map(t=>[t.key,0])
    ),
    armas: [
      {nombre:"Arma 1", materiales:new Set(), runas:new Set()},
      {nombre:"Arma 2", materiales:new Set(), runas:new Set()}
    ]
  };
}
let state = makeInitialState();
let uid = 1;
const nextId = () => uid++;

/* =========================================================
   HELPERS DE COSTE
   ========================================================= */
function costoSubida(table, actual, nuevo){
  if(nuevo<=actual) return 0;
  return (table.acumulado[nuevo]||0) - (table.acumulado[actual]||0);
}
function addToCart(category, line, cost){
  state.cart.push({id:nextId(), category, line, cost});
}
function cartTotal(){
  return state.cart.reduce((sum,i)=> sum + i.cost, 0);
}
function cartTotalFor(category){
  return state.cart.filter(i=>i.category===category).reduce((sum,i)=> sum + i.cost, 0);
}
function titulosCost(){
  return state.titulos.reduce((sum,t)=> sum + costoTitulo(t.tipo,t.nota), 0);
}
function idiomasCost(){
  return state.idiomas.reduce((sum,i)=> sum + costoIdioma(i.tipo,i.nivel), 0);
}
function talentosCost(){
  let sum = 0;
  state.talentos.forEach(name=>{
    const t = TALENTOS.find(x=>x[0]===name);
    if(t) sum += t[1];
  });
  return sum;
}
function razaCost(){
  const r = RAZAS.find(x=>x[0]===state.raza);
  return r ? r[1] : 0;
}
function arcanosCost(){
  let sum = 0;
  ARCANO_TIERS.forEach(t=> sum += state.arcanos[t.key]*t.price);
  POCION_TIERS.forEach(t=> sum += state.arcanos[t.key]*t.price);
  RITUAL_TIERS.forEach(t=> sum += state.arcanos[t.key]*t.price);
  OBJETO_TIERS.forEach(t=> sum += state.arcanos[t.key]*t.price);
  return sum;
}
function weaponMatCost(w){
  let sum=0; w.materiales.forEach(n=>{const m=MATERIALES.find(x=>x[0]===n); if(m) sum+=m[1];});
  return sum;
}
function weaponMatSlots(w){
  let sum=0; w.materiales.forEach(n=>{const m=MATERIALES.find(x=>x[0]===n); if(m) sum+=m[2];});
  return sum;
}
function weaponRunCost(w){
  let sum=0; w.runas.forEach(n=>{const r=RUNAS.find(x=>x[0]===n); if(r) sum+=r[2];});
  return sum;
}
function weaponRunSlots(w){
  let sum=0; w.runas.forEach(n=>{const r=RUNAS.find(x=>x[0]===n); if(r) sum+=r[1];});
  return sum;
}
function weaponCost(w){ return weaponMatCost(w) + weaponRunCost(w); }
function armasCost(){ return state.armas.reduce((s,w)=> s+weaponCost(w), 0); }

function pociencesLevel(){ return state.skillsBase["Pociones"] || 0; }
function ritualesLevel(){ return state.skillsBase["Rituales"] || 0; }

function otrosTotal(){
  return titulosCost()+idiomasCost()+talentosCost()+razaCost()+arcanosCost()+armasCost();
}
function totalGastado(){
  return cartTotal() + otrosTotal();
}

/* =========================================================

   ========================================================= */
function renderLedger(){
  const gastadas = totalGastado();
  const restantes = state.disponibles - gastadas;
  document.getElementById("valGastadas").textContent = gastadas.toLocaleString("es-ES");
  const restEl = document.getElementById("valRestantes");
  restEl.textContent = restantes.toLocaleString("es-ES");
  restEl.parentElement.classList.toggle("negative", restantes < 0);
  document.getElementById("valCartQuick").textContent = `${state.cart.length} ítem(s) · ${cartTotal().toLocaleString("es-ES")} gr`;
}

});

  state = makeInitialState();

}

    resetArmed = true;
    resetBtn.textContent = "¿Seguro? Tocá de nuevo para reiniciar";
    resetBtn.style.color = "var(--bad)";
    resetBtn.style.borderColor = "var(--bad)";
    clearTimeout(resetArmTimeout);
    resetArmTimeout = setTimeout(()=>{
      resetArmed = false;
      resetBtn.textContent = "Reiniciar todo";
      resetBtn.style.color = "";
      resetBtn.style.borderColor = "";
    }, 3500);
    return;
  }
  clearTimeout(resetArmTimeout);
  resetArmed = false;
  resetBtn.textContent = "Reiniciar todo";

function activateTab(id){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  const btn = document.querySelector(`.tab-btn[data-tab="${id}"]`);
  if(btn) btn.classList.add("active");
  const panel = document.getElementById("panel-"+id);
  if(panel) panel.classList.add("active");
}

function buildTabs(){
  const bar = document.getElementById("tabBar");
  const content = document.getElementById("tabContent");
  TABS.forEach((t,i)=>{
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (i===0?" active":"") + (t.cart?" cart-tab":"");
    btn.textContent = t.label;
    btn.dataset.tab = t.id;
    btn.addEventListener("click", ()=> activateTab(t.id));
    bar.appendChild(btn);

    const panel = document.createElement("div");
    panel.className = "panel" + (i===0?" active":"");
    panel.id = "panel-"+t.id;
    content.appendChild(panel);
  });
}

function renderAll(){
  Object.values(RENDERERS).forEach(fn=>fn());
  renderLedger();
}

/* ---------- helper: fila "nivel actual -> nivel nuevo -> agregar" ---------- */
function buildLevelBuyRow({table, max, actual, target, onActualChange, onTargetChange, onAdd}){
  const cost = costoSubida(table, actual, target);
  const wrap = document.createElement("div");
  wrap.className = "buy-row";
  const actualOpts = [];
  for(let l=0;l<=max;l++) actualOpts.push(`<option value="${l}" ${l===actual?"selected":""}>${l}</option>`);
  const targetOpts = [];
  for(let l=0;l<=max;l++) targetOpts.push(`<option value="${l}" ${l===target?"selected":""}>${l}</option>`);
  wrap.innerHTML = `
    <div class="field"><label>Nivel actual</label><select class="lvl-actual">${actualOpts.join("")}</select></div>
    <div class="arrow">→</div>
    <div class="field"><label>Nivel nuevo</label><select class="lvl-target">${targetOpts.join("")}</select></div>
    <div class="buy-preview ${cost>0?"":"zero"}">${cost>0?cost+" gr":"—"}</div>
    <button class="btn" ${cost>0?"":"disabled"}>Agregar al carrito</button>`;
  wrap.querySelector(".lvl-actual").addEventListener("change", e=> onActualChange(Number(e.target.value)));
  wrap.querySelector(".lvl-target").addEventListener("change", e=> onTargetChange(Number(e.target.value)));
  wrap.querySelector("button").addEventListener("click", ()=>{ if(cost>0) onAdd(cost); });
  return wrap;
}

/* ---------- ARCANOS ---------- */
function renderArcanoGroup(title, tiers){
  const wrap = document.createElement("div");
  wrap.className = "arc-group";
  let warn = "";
  const gr = state.arcanos;
  tiers.forEach(t=>{
    if(t.requiresLE && gr[t.key] > gr[t.requiresLE]){
      warn += `Faltan ${title.toLowerCase()} del nivel anterior para sostener "${t.label}". `;
    }
    if(t.gate!==undefined){
      const lvl = title==="Pociones" ? pociencesLevel() : ritualesLevel();
      if(gr[t.key] > 0 && lvl < t.gate){
        warn += `"${t.label}" requiere ${title} nivel ${t.gate} o superior (actual: ${lvl}). `;
      }
    }
  });
  const cost = tiers.reduce((s,t)=> s + gr[t.key]*t.price, 0);
  wrap.innerHTML = `<h3>${title} <span style="color:var(--gold-dim);font-size:0.8rem;float:right;">${cost} gr</span></h3>`;
  tiers.forEach(t=>{
    const row = document.createElement("div");
    row.className = "arc-row";
    row.innerHTML = `<label>${t.label}<small>${t.price} gr / unidad</small></label>
      <input type="number" min="0" data-arc="${t.key}" value="${gr[t.key]}">`;
    wrap.appendChild(row);
  });
  if(warn) {
    const w = document.createElement("div");
    w.className = "warn-text";
    w.textContent = warn.trim();
    wrap.appendChild(w);
  }
  return wrap;
}

/* ---------- RESUMEN / TEXTO PARA COPIAR ---------- */
function buildSummaryLines(){
  const lines = [];

  function pushCartCategory(category, heading){
    const rows = state.cart.filter(i=>i.category===category && !i.isEspecifico).map(i=>i.line);
    if(rows.length){ lines.push(heading, ...rows, ""); }
  }
  pushCartCategory("ESTADÍSTICAS", "ESTADÍSTICAS");
  pushCartCategory("HABILIDADES", "HABILIDADES");
  pushCartCategory("ESPECIALIZACIONES", "ESPECIALIZACIONES");

  const trasfRows = state.cart.filter(i=>i.category==="TRASFONDOS").map(i=>i.line);
  if(trasfRows.length){ lines.push("TRASFONDOS", ...trasfRows, ""); }

  const titRows = state.titulos.map(t=>
    `${t.asignatura} (${t.tipo}, ${t.nota}) — ${costoTitulo(t.tipo,t.nota)} grageas`
  );
  if(titRows.length){ lines.push("TÍTULOS ACADÉMICOS", ...titRows, ""); }

  const idRows = state.idiomas.map(i=>
    `Idioma ${i.tipo} nivel ${i.nivel} — ${costoIdioma(i.tipo,i.nivel)} grageas`
  );
  if(idRows.length){ lines.push("IDIOMAS", ...idRows, ""); }

  const talRows = TALENTOS.filter(([name])=>state.talentos.has(name)).map(([name,price])=>
    `${name} — ${price} grageas`
  );
  if(talRows.length){ lines.push("TALENTOS", ...talRows, ""); }

  if(state.raza !== "Humano"){
    lines.push("PERSONAJE", `Raza: ${state.raza} — ${razaCost()} grageas`, "");
  }

  const arcRows = [];
  [...ARCANO_TIERS,...POCION_TIERS,...RITUAL_TIERS,...OBJETO_TIERS].forEach(t=>{
    const qty = state.arcanos[t.key];
    if(qty>0) arcRows.push(`${t.label} x${qty} — ${qty*t.price} grageas`);
  });
  if(arcRows.length){ lines.push("ARCANOS", ...arcRows, ""); }

  state.armas.forEach(w=>{
    const matRows = [...w.materiales].map(n=>{
      const m = MATERIALES.find(x=>x[0]===n);
      return `${n} — ${m[1]} grageas`;
    });
    const runRows = [...w.runas].map(n=>{
      const r = RUNAS.find(x=>x[0]===n);
      return `${n} — ${r[2]} grageas`;
    });
    if(matRows.length || runRows.length){
      lines.push(w.nombre.toUpperCase(), ...matRows, ...runRows, "");
    }
  });

  while(lines.length && lines[lines.length-1] === "") lines.pop();

  if(lines.length === 0){
    lines.push("Todavía no seleccionaste ningún canje.");
  }

  lines.push("");
  lines.push(`Total: ${totalGastado()} grageas.`);
  return lines;
}

function isHeadingLine(line){
  return line.length>0 && line===line.toUpperCase() && !line.includes("—") && !line.startsWith("Total");
}

RENDERERS.resumen = function(){
  const panel = document.getElementById("panel-resumen");
  panel.innerHTML = "";
  const lines = buildSummaryLines();
  const plainText = lines.join("\n");

  panel.innerHTML = `<h2 class="section-title">Resumen para copiar</h2>
    <p class="section-sub">Todo lo que agregaste al carrito y en las demás pestañas, ya redactado y con el cálculo hecho. Copialo y pegalo donde tengas que hacer tu petición de canje.</p>`;

  const toolbar = document.createElement("div");
  toolbar.className = "summary-toolbar";
  toolbar.innerHTML = `<button class="btn" id="copySummaryBtn">Copiar texto</button>
    <span class="copy-status" id="copyStatus">Copiado ✓</span>`;
  panel.appendChild(toolbar);

  const box = document.createElement("div");
  box.className = "summary-box";
  box.id = "summaryBox";
  box.innerHTML = lines.map(line=>{
    if(line === "") return "";
    if(isHeadingLine(line)) return `<span class="sec-heading">${line}</span>`;
    if(line.startsWith("Total:")) return `<span class="sec-total">${line}</span>`;
    return line;
  }).join("\n");
  panel.appendChild(box);

  document.getElementById("copySummaryBtn").addEventListener("click", ()=>{
    const doCopy = () => {
      const status = document.getElementById("copyStatus");
      status.classList.add("show");
      setTimeout(()=>status.classList.remove("show"), 1600);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(plainText).then(doCopy).catch(()=>{
        fallbackCopy(plainText); doCopy();
      });
    } else {
      fallbackCopy(plainText); doCopy();
    }
  });
};

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* =========================================================
   INIT
   ========================================================= */
buildTabs();
renderAll();
</script>
